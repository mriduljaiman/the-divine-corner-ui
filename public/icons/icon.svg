<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGradient)"/>

  <!-- Shopping Bag -->
  <g transform="translate(96, 80)">
    <!-- Bag Body -->
    <path
      d="M40 120 L40 320 Q40 340 60 340 L260 340 Q280 340 280 320 L280 120 Q280 100 260 100 L60 100 Q40 100 40 120 Z"
      fill="white"
      fill-opacity="0.95"
    />

    <!-- Bag Handle -->
    <path
      d="M100 100 L100 60 Q100 20 160 20 Q220 20 220 60 L220 100"
      fill="none"
      stroke="white"
      stroke-width="24"
      stroke-linecap="round"
    />

    <!-- Star/Sparkle decoration -->
    <g transform="translate(160, 200)">
      <path
        d="M0 -40 L10 -10 L40 0 L10 10 L0 40 L-10 10 L-40 0 L-10 -10 Z"
        fill="#6366f1"
      />
    </g>
  </g>
</svg>
